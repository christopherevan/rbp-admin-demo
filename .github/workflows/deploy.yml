name: Deploy

# The deploy job stays off until repository variable DEPLOY_ENABLED is "true".
# CI and the GHCR image build still run on every push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export pushed image reference
        id: image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          SHA_TAG="$(printf '%s\n' "$META_TAGS" | grep ':sha-' | head -n 1)"
          echo "ref=${SHA_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      # SSH on the VPS is only reachable over Tailscale. Join the tailnet as a
      # short-lived node tagged tag:ci, removed automatically when the job ends.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The VPS runs Tailscale SSH, letting this runner in as VPS_USER via its
      # tailnet identity (tag:ci), so no SSH key is needed. known_hosts still
      # pins the VPS host keys.
      - name: Set up SSH
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Stage only the pinned image tag and invoke the single root-owned deploy
      # script permitted by sudoers. The deploy user cannot edit compose files,
      # .env, or run arbitrary docker commands.
      - name: Trigger VPS deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          printf '%s\n' "$APP_IMAGE" | ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'cat > release.image'
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" sudo /usr/local/sbin/kinetra-demo-deploy
