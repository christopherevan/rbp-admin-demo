name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export pushed image reference
        id: image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          SHA_TAG="$(printf '%s\n' "$META_TAGS" | grep ':sha-' | head -n 1)"
          echo "ref=${SHA_TAG}" >> "$GITHUB_OUTPUT"

  # Stays off until the repository variable DEPLOY_ENABLED is set to "true".
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout compose file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SSH on the VPS is only reachable over Tailscale. Join the tailnet as a
      # short-lived node tagged tag:ci, removed automatically when the job ends.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The VPS runs Tailscale SSH, letting this runner in as VPS_USER via its
      # tailnet identity (tag:ci), so no SSH key is needed. known_hosts pins
      # the VPS host key.
      - name: Set up SSH
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          RAW_APP_DIR="${VPS_APP_DIR:-kinetra-admin-demo}"

          REMOTE_DIR="$(ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" bash -s -- "$RAW_APP_DIR" <<'EOF'
          set -euo pipefail
          DIR="${1/#\~/$HOME}"
          case "$DIR" in
            /*) ;;
            *) DIR="$HOME/$DIR" ;;
          esac
          mkdir -p "$DIR"
          printf '%s\n' "$DIR"
          EOF
          )"

          # Sync docker-compose.yml over Tailscale SSH.
          ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" "cat > '${REMOTE_DIR}/docker-compose.yml'" < docker-compose.yml

          # Log into GHCR, pin APP_IMAGE in .env, pull, and restart containers.
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

          ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" bash -s -- "$REMOTE_DIR" "$APP_IMAGE" <<'EOF'
          set -euo pipefail
          APP_DIR="$1"
          APP_IMAGE="$2"
          cd "$APP_DIR"

          if [ ! -f .env ]; then
            echo "Missing ${APP_DIR}/.env on the VPS. Copy .env.docker.example to .env and set APP_KEY, APP_URL, and SERVER_NAME first." >&2
            exit 1
          fi

          if grep -q '^APP_IMAGE=' .env; then
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
          else
            printf '\nAPP_IMAGE=%s\n' "$APP_IMAGE" >> .env
          fi

          docker compose pull
          docker compose up -d --no-build --remove-orphans
          docker image prune -f
          docker compose ps
          EOF
